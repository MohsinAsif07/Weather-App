<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mausam App - Weather</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="main-box">
    <header>
      <h2>🌦️ Mausam App</h2>
      <p>Apne sheher ka mausam dekho</p>
    </header>

    <form id="myForm">
      <input id="cityInput" type="text" placeholder="City likho.. Karachi" />
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div class="chips">
      <button onclick="quickSearch('Karachi')">Karachi</button>
      <button onclick="quickSearch('Lahore')">Lahore</button>
      <button onclick="quickSearch('Islamabad')">Islamabad</button>
      <button onclick="quickSearch('Hyderabad')">Hyderabad</button>
    </div>

    <p id="msg"></p>

    <div id="weatherBox" style="display:none;">
      <h1 id="cityName">-</h1>
      <p id="country">-</p>
      <h1 id="temp">--°</h1>
      <p id="desc">-</p>
      <p>Feels Like: <b id="feels">-</b></p>

      <div class="boxes">
        <div class="mini-box">Humidity<br><b id="hum">-</b></div>
        <div class="mini-box">Wind<br><b id="wind">-</b></div>
        <div class="mini-box">Rain<br><b id="rain">-</b></div>
      </div>

      <h3>Next 5 Days</h3>
      <div id="days"></div>
    </div>
  </div>
</body>
</html>
